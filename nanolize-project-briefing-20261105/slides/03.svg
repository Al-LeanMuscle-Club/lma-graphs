<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-label="复杂度的代价，会在每一次开发任务中重新支付" role="img"><defs><style>@font-face{font-family:Nanolize;src:url(../assets/noto-regular.woff2)}@font-face{font-family:Nanolize;src:url(../assets/noto-bold.woff2);font-weight:700}text{font-family:Nanolize,"Microsoft YaHei",sans-serif}</style></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="43.39">NANOLIZE ANYTHING   /   问题与价值</tspan></text><text font-size="36" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="56" y="115.08">复杂度的代价，会在每一次开发任务中重新支付</tspan></text><text font-size="20" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="58" y="169.6">项目的价值假设：一次有证据的简化，降低后续多次任务的累计负担。</tspan></text><path d="M56 668 L1224 668" fill="none" stroke="#DCE5E7" stroke-width="1"/><text font-size="11" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="56" y="693.33">价值推导；尚未形成跨仓库、完整成本口径的 ROI 结论</tspan></text><text font-size="14" fill="#007F78" font-weight="700" text-anchor="end"><tspan x="1225" y="694.42">03</tspan></text><rect x="56" y="222" width="372" height="254" rx="12" fill="#F4F7F7" stroke="none"/><text font-size="20" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="79" y="262.6">01</tspan></text><text font-size="26" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="79" y="315.78">重复实现</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="79" y="368.63">相似规则分散在多处，</tspan><tspan x="79" y="397.19">一次改动需要反复同步。</tspan></text><rect x="454" y="222" width="372" height="254" rx="12" fill="#F4F7F7" stroke="none"/><text font-size="20" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="477" y="262.6">02</tspan></text><text font-size="26" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="477" y="315.78">隐式知识</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="477" y="368.63">理解接口与配置，</tspan><tspan x="477" y="397.19">需要跨文件补全前提。</tspan></text><rect x="852" y="222" width="372" height="254" rx="12" fill="#F4F7F7" stroke="none"/><text font-size="20" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="875" y="262.6">03</tspan></text><text font-size="26" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="875" y="315.78">验证不透明</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="875" y="368.63">检查通过覆盖了什么，</tspan><tspan x="875" y="397.19">与新代码是否匹配不清楚。</tspan></text><rect x="56" y="519" width="1168" height="110" rx="10" fill="#112B36" stroke="none"/><text font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="80" y="563.84">累计净收益 ≈ 后续任务节省 − 重构、验证与维护投入</tspan></text><text font-size="20" fill="#DDF3EC" font-weight="400" text-anchor="start"><tspan x="82" y="602.6">同一成功标准、完整成本记录、足够多的后续任务，是验证价值的前提。</tspan></text></svg>