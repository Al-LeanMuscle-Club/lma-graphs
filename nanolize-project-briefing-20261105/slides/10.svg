<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-label="设计演进：同时优化源码 tokens 与实现逻辑" role="img"><defs><style>@font-face{font-family:Nanolize;src:url(../assets/noto-regular.woff2)}@font-face{font-family:Nanolize;src:url(../assets/noto-bold.woff2);font-weight:700}text{font-family:Nanolize,"Microsoft YaHei",sans-serif}</style></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="43.39">NANOLIZE ANYTHING   /   新分支 · 已实现</tspan></text><text font-size="36" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="56" y="115.08">设计演进：同时优化源码 tokens 与实现逻辑</tspan></text><text font-size="20" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="58" y="169.6">codex/token-count-and-logic：体积目标成为软目标；功能与性能约束优先。</tspan></text><path d="M56 668 L1224 668" fill="none" stroke="#DCE5E7" stroke-width="1"/><a href="https://github.com/Al-LeanMuscle-Club/nanolize-anything/blob/8b95fb56bccec80c148668afc206830ac54bb5af/docs/graph-rewrite.md" target="_blank" rel="noopener noreferrer"><text font-size="11" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="56" y="693.33">依据：token 分支 8b95fb5 · refactoring.py / token_metrics.py / docs/graph-rewrite.md</tspan></text></a><text font-size="14" fill="#007F78" font-weight="700" text-anchor="end"><tspan x="1225" y="694.42">10</tspan></text><rect x="56" y="230" width="372" height="310" rx="12" fill="#DDF3EC" stroke="none"/><text font-size="20" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="79" y="270.6">优化目标 A</tspan></text><text font-size="26" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="79" y="323.78">源码 tokens</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="79" y="376.63">计量原始生产源码文本。</tspan><tspan x="79" y="405.19">固定分词口径，记录版本。</tspan><tspan x="79" y="433.75">反映阅读材料的规模。</tspan></text><rect x="454" y="230" width="372" height="310" rx="12" fill="#F4F7F7" stroke="none"/><text font-size="20" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="477" y="270.6">优化目标 B</tspan></text><text font-size="26" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="477" y="323.78">实现逻辑</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="477" y="376.63">减少重复规则与维护点。</tspan><tspan x="477" y="405.19">当前用 Python AST 辅助计量。</tspan><tspan x="477" y="433.75">由结构解释支撑指标变化。</tspan></text><rect x="852" y="230" width="372" height="310" rx="12" fill="#EAF0F6" stroke="none"/><text font-size="20" fill="#3D647C" font-weight="700" text-anchor="start"><tspan x="875" y="270.6">独立验收维度</tspan></text><text font-size="26" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="875" y="323.78">真实任务成本</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="875" y="376.63">在相同任务和模型下，</tspan><tspan x="875" y="405.19">比较成功完成任务的 tokens。</tspan><tspan x="875" y="433.75">同时记录耗时与评测开销。</tspan></text><rect x="56" y="600" width="1168" height="49" rx="8" fill="#DDF3EC" stroke="none"/><text font-size="20" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="76" y="631.6">源码 tokens ≠ 模型调用 tokens；指标改善必须服从行为、类型、配置与性能约束。</tspan></text></svg>