<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-label="外部契约保持稳定，内部结构可以重新设计" role="img"><defs><style>@font-face{font-family:Nanolize;src:url(../assets/noto-regular.woff2)}@font-face{font-family:Nanolize;src:url(../assets/noto-bold.woff2);font-weight:700}text{font-family:Nanolize,"Microsoft YaHei",sans-serif}</style></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="43.39">NANOLIZE ANYTHING   /   设计理念</tspan></text><text font-size="36" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="56" y="115.08">外部契约保持稳定，内部结构可以重新设计</tspan></text><text font-size="20" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="58" y="169.6">功能范围先冻结；实现方式可以改变；每个结论都要对应实际证据。</tspan></text><path d="M56 668 L1224 668" fill="none" stroke="#DCE5E7" stroke-width="1"/><a href="https://github.com/Al-LeanMuscle-Club/nanolize-anything/blob/8b95fb56bccec80c148668afc206830ac54bb5af/docs/graph-rewrite.md" target="_blank" rel="noopener noreferrer"><text font-size="11" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="56" y="693.33">依据：token 分支 docs/graph-rewrite.md 与 refactoring policy</tspan></text></a><text font-size="14" fill="#007F78" font-weight="700" text-anchor="end"><tspan x="1225" y="694.42">04</tspan></text><rect x="56" y="220" width="560" height="319" rx="12" fill="#F4F7F7" stroke="none"/><rect x="80" y="243" width="112" height="30" rx="7" fill="#DDF3EC" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="90" y="260.39">必须保持</tspan></text><text font-size="25" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="82" y="324.75">所选功能与公开接口</tspan><tspan x="82" y="358.75">校验、错误说明、日志与边界</tspan><tspan x="82" y="392.75">类型与配置语义</tspan><tspan x="82" y="426.75">必要性能和支持的运行路径</tspan></text><rect x="642" y="220" width="582" height="319" rx="12" fill="#DDF3EC" stroke="none"/><rect x="666" y="243" width="138" height="30" rx="7" fill="#FFFFFF" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="676" y="260.39">可以重新设计</tspan></text><text font-size="25" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="668" y="324.75">模块组织与内部架构</tspan><tspan x="668" y="358.75">重复规则与共享实现</tspan><tspan x="668" y="392.75">向量化和成熟算子复用</tspan><tspan x="668" y="426.75">冗余说明的精简</tspan></text><rect x="56" y="600" width="1168" height="49" rx="8" fill="#DDF3EC" stroke="none"/><text font-size="20" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="76" y="631.6">范围选择与体积目标分离：调小目标，不会自动减少必须保留的功能。</tspan></text></svg>