<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-label="用户用功能图确认范围，系统负责执行与追踪证据" role="img"><defs><style>@font-face{font-family:Nanolize;src:url(../assets/noto-regular.woff2)}@font-face{font-family:Nanolize;src:url(../assets/noto-bold.woff2);font-weight:700}text{font-family:Nanolize,"Microsoft YaHei",sans-serif}</style></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="43.39">NANOLIZE ANYTHING   /   产品体验</tspan></text><text font-size="36" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="56" y="115.08">用户用功能图确认范围，系统负责执行与追踪证据</tspan></text><text font-size="20" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="58" y="169.6">把仓库级操作转成可理解、可选择、可审阅的功能级工作流。</tspan></text><path d="M56 668 L1224 668" fill="none" stroke="#DCE5E7" stroke-width="1"/><a href="https://github.com/Al-LeanMuscle-Club/nanolize-anything/blob/f83bd58cdce2a434706b2264e15857cfd5c51deb/docs/capability-planner.png" target="_blank" rel="noopener noreferrer"><text font-size="11" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="56" y="693.33">界面来自 main/docs/capability-planner.png；合成示例，非 Detectron2 实测结果</tspan></text></a><text font-size="14" fill="#007F78" font-weight="700" text-anchor="end"><tspan x="1225" y="694.42">07</tspan></text><rect x="56" y="215" width="775" height="415" rx="12" fill="#F4F7F7" stroke="#DCE5E7"/><defs><clipPath id="clip-7-8"><rect x="66" y="225" width="755" height="395"/></clipPath></defs><image href="../assets/planner.png" x="21.627124357622193" y="-41.60049627791574" width="835.3918329552037" height="980.1488833746901" clip-path="url(#clip-7-8)"/><text font-size="22" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="866" y="252.66">01</tspan></text><text font-size="25" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="926" y="255.75">先看功能</tspan></text><text font-size="22" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="866" y="304.66">按能力组织，而非只看目录。</tspan></text><text font-size="22" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="866" y="389.66">02</tspan></text><text font-size="25" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="926" y="392.75">再定范围</tspan></text><text font-size="22" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="866" y="441.66">核心能力和必要依赖受保护。</tspan></text><text font-size="22" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="866" y="526.66">03</tspan></text><text font-size="25" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="926" y="529.75">独立设目标</tspan></text><text font-size="22" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="866" y="578.66">选择范围与体积目标分别控制。</tspan></text></svg>