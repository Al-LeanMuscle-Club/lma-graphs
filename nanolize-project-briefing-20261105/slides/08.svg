<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-label="把“通过了什么”绑定到“哪一版代码”" role="img"><defs><style>@font-face{font-family:Nanolize;src:url(../assets/noto-regular.woff2)}@font-face{font-family:Nanolize;src:url(../assets/noto-bold.woff2);font-weight:700}text{font-family:Nanolize,"Microsoft YaHei",sans-serif}</style></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="43.39">NANOLIZE ANYTHING   /   可信验证</tspan></text><text font-size="36" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="56" y="115.08">把“通过了什么”绑定到“哪一版代码”</tspan></text><text font-size="20" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="58" y="169.6">保留失败和未知，才能让后续评审、修复与交付建立在同一份事实之上。</tspan></text><path d="M56 668 L1224 668" fill="none" stroke="#DCE5E7" stroke-width="1"/><a href="https://github.com/Al-LeanMuscle-Club/nanolize-anything/blob/f83bd58cdce2a434706b2264e15857cfd5c51deb/docs/reliable-workflows.md" target="_blank" rel="noopener noreferrer"><text font-size="11" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="56" y="693.33">依据：main README、reliable-workflows 与 post-nanolize-reports</tspan></text></a><text font-size="14" fill="#007F78" font-weight="700" text-anchor="end"><tspan x="1225" y="694.42">08</tspan></text><rect x="56" y="224" width="277" height="310" rx="12" fill="#F4F7F7" stroke="none"/><rect x="76" y="245" width="78" height="30" rx="7" fill="#DDF3EC" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="86" y="262.39">冻结</tspan></text><text font-size="24" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="76" y="328.72">先固定原版证据</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="76" y="420.63">原版版本、输入、测试、</tspan><tspan x="76" y="449.19">输出与任务先冻结。</tspan></text><rect x="353" y="224" width="277" height="310" rx="12" fill="#F4F7F7" stroke="none"/><rect x="373" y="245" width="78" height="30" rx="7" fill="#DDF3EC" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="383" y="262.39">对照</tspan></text><text font-size="24" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="373" y="328.72">由独立验证方检查</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="373" y="420.63">行为失败保留；</tspan><tspan x="373" y="449.19">修复后重跑保留检查。</tspan></text><rect x="650" y="224" width="277" height="310" rx="12" fill="#F4F7F7" stroke="none"/><rect x="670" y="245" width="78" height="30" rx="7" fill="#DDF3EC" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="680" y="262.39">来源</tspan></text><text font-size="24" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="670" y="328.72">确认运行的是候选</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="670" y="420.63">审计模块来源；</tspan><tspan x="670" y="449.19">新环境验证构建与安装。</tspan></text><rect x="947" y="224" width="277" height="310" rx="12" fill="#F4F7F7" stroke="none"/><rect x="967" y="245" width="78" height="30" rx="7" fill="#DDF3EC" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="977" y="262.39">绑定</tspan></text><text font-size="24" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="967" y="328.72">结果随版本更新</tspan></text><text font-size="21" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="967" y="420.63">代码变化后重新验证；</tspan><tspan x="967" y="449.19">历史失败与缺口仍可追溯</tspan><tspan x="967" y="477.75">。</tspan></text><rect x="56" y="600" width="1168" height="49" rx="8" fill="#FFF0DE" stroke="none"/><text font-size="20" fill="#A45A21" font-weight="700" text-anchor="start"><tspan x="76" y="631.6">检查通过 = 已运行条件下的证据；完整功能等价与全量性能需要额外覆盖。</tspan></text></svg>