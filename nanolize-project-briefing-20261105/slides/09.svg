 y="412.63">候选</tspan></text><rect x="160" y="390" width="172.6" height="33" rx="4" fill="#007F78" stroke="none"/><text font-size="23" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="160" y="451.69">36,458 物理行</tspan></text><text font-size="44" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="80" y="531.32">−52.6%</tspan></text><text font-size="17" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="354" y="511.51">体积缩减</tspan><tspan x="354" y="534.63">不等于逻辑或成本降幅</tspan></text><rect x="646" y="221" width="578" height="343" rx="12" fill="#F4F7F7" stroke="none"/><text font-size="24" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="671" y="267.72">已有证据与尚未完成的验收</tspan></text><text font-size="35" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="673" y="337.05">160/160</tspan></text><text font-size="21" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="865" y="328.63">历史行为检查组通过</tspan></text><text font-size="35" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="673" y="407.05">23/23</tspan></text><text font-size="21" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="865" y="398.63">历史部分 GPU 用例通过</tspan></text><rect x="671" y="462" width="181" height="30" rx="7" fill="#FFF0DE" stroke="none"/><text font-size="13" fill="#A45A21" font-weight="700" text-anchor="start"><tspan x="681" y="479.39">任务验收未完成</tspan></text><text font-size="17" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="671" y="525.51">静态审查发现具体行为差异；候选隐藏验收未运行。</tspan></text><rect x="56" y="600" width="1168" height="49" rx="8" fill="#FFF0DE" stroke="none"/><text font-size="20" fill="#A45A21" font-weight="700" text-anchor="start"><tspan x="76" y="631.6">经验：精简幅度、功能正确性与任务成本必须独立验收。</tspan></text></svg>