<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-label="附录 B｜三个指标，回答三个不同的问题" role="img"><defs><style>@font-face{font-family:Nanolize;src:url(../assets/noto-regular.woff2)}@font-face{font-family:Nanolize;src:url(../assets/noto-bold.woff2);font-weight:700}text{font-family:Nanolize,"Microsoft YaHei",sans-serif}</style></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none"/><text font-size="13" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="43.39">NANOLIZE ANYTHING   /   计量口径</tspan></text><text font-size="36" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="56" y="115.08">附录 B｜三个指标，回答三个不同的问题</tspan></text><text font-size="20" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="58" y="169.6">固定定义、记录覆盖范围，让每次比较可以解释和复核。</tspan></text><path d="M56 668 L1224 668" fill="none" stroke="#DCE5E7" stroke-width="1"/><a href="https://github.com/Al-LeanMuscle-Club/nanolize-anything/blob/8b95fb56bccec80c148668afc206830ac54bb5af/src/nanolize_anything/token_metrics.py" target="_blank" rel="noopener noreferrer"><text font-size="11" fill="#60727D" font-weight="400" text-anchor="start"><tspan x="56" y="693.33">依据：token_metrics.py、logic_metrics.py、docs/task-effort.md（token 分支）</tspan></text></a><text font-size="14" fill="#007F78" font-weight="700" text-anchor="end"><tspan x="1225" y="694.42">14</tspan></text><text font-size="24" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="255.72">源码 tokens</tspan></text><text font-size="22" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="296" y="253.66">问题：文本体积是否减少？</tspan><tspan x="296" y="283.58">口径：逐文件 tiktoken / o200k_base 求和，记录版本与覆盖。</tspan></text><path d="M56 330 L1224 330" fill="none" stroke="#DCE5E7" stroke-width="2"/><text font-size="24" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="377.72">Python AST</tspan></text><text font-size="22" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="296" y="375.66">问题：静态实现逻辑是否缩减？</tspan><tspan x="296" y="405.58000000000004">口径：归一化语法树节点；只覆盖 Python，不外推到 CUDA / C++。</tspan></text><path d="M56 451 L1224 451" fill="none" stroke="#DCE5E7" stroke-width="2"/><text font-size="24" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="56" y="499.72">任务 tokens</tspan></text><text font-size="22" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="296" y="497.66">问题：正确完成任务的模型用量是否下降？</tspan><tspan x="296" y="527.58">口径：真实输入＋输出及重试；评测开销、耗时另列。</tspan></text><rect x="56" y="600" width="1168" height="49" rx="8" fill="#DDF3EC" stroke="none"/><text font-size="20" fill="#007F78" font-weight="700" text-anchor="start"><tspan x="76" y="631.6">所有口径都保留缺口：缺失 usage、覆盖不全或版本不兼容时，不把未知写成 0。</tspan></text></svg>