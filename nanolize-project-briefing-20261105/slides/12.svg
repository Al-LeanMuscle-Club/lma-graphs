<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-label="下一步：用少量代表性仓库，建立可复用的验收样板" role="img"><defs><style>@font-face{font-family:Nanolize;src:url(../assets/noto-regular.woff2)}@font-face{font-family:Nanolize;src:url(../assets/noto-bold.woff2);font-weight:700}text{font-family:Nanolize,"Microsoft YaHei",sans-serif}</style></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#112B36" stroke="none"/><text font-size="13" fill="#DDF3EC" font-weight="700" text-anchor="start"><tspan x="56" y="43.39">NANOLIZE ANYTHING   /   建议与讨论</tspan></text><text font-size="36" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="56" y="115.08">下一步：用少量代表性仓库，建立可复用的验收样板</tspan></text><text font-size="20" fill="#DCE5E7" font-weight="400" text-anchor="start"><tspan x="58" y="169.6">从工程闭环，走向稳定收益与可扩展的项目接入方法。</tspan></text><path d="M56 668 L1224 668" fill="none" stroke="#3D647C" stroke-width="1"/><text font-size="11" fill="#DCE5E7" font-weight="400" text-anchor="start"><tspan x="56" y="693.33">以下为建议路线与支持事项，尚未形成排期或投入承诺</tspan></text><text font-size="14" fill="#DDF3EC" font-weight="700" text-anchor="end"><tspan x="1225" y="694.42">12</tspan></text><rect x="56" y="238" width="372" height="268" rx="12" fill="#1B3945" stroke="none"/><text font-size="22" fill="#DDF3EC" font-weight="700" text-anchor="start"><tspan x="79" y="281.66">01</tspan></text><text font-size="29" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="79" y="345.87">补齐验收</tspan></text><text font-size="23" fill="#DCE5E7" font-weight="400" text-anchor="start"><tspan x="79" y="408.69">已知行为差异</tspan><tspan x="79" y="439.97">关键性能与环境边界</tspan></text><rect x="454" y="238" width="372" height="268" rx="12" fill="#1B3945" stroke="none"/><text font-size="22" fill="#DDF3EC" font-weight="700" text-anchor="start"><tspan x="477" y="281.66">02</tspan></text><text font-size="29" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="477" y="345.87">复现收益</tspan></text><text font-size="23" fill="#DCE5E7" font-weight="400" text-anchor="start"><tspan x="477" y="408.69">2–3 个代表性仓库</tspan><tspan x="477" y="439.97">固定任务与完整成本</tspan></text><rect x="852" y="238" width="372" height="268" rx="12" fill="#1B3945" stroke="none"/><text font-size="22" fill="#DDF3EC" font-weight="700" text-anchor="start"><tspan x="875" y="281.66">03</tspan></text><text font-size="29" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="875" y="345.87">形成接入模板</tspan></text><text font-size="23" fill="#DCE5E7" font-weight="400" text-anchor="start"><tspan x="875" y="408.69">功能知识与检查配方</tspan><tspan x="875" y="439.97">统一报告与复用流程</tspan></text><path d="M58 548 L1222 548" fill="none" stroke="#3D647C" stroke-width="1"/><text font-size="23" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="58" y="594.69">建议支持：试点业务 owner  /  真实测试与性能基线  /  有上限的评测预算  /  独立验收</tspan></text></svg>